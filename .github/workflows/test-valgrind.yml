name: Test Valgrind

# like the docker tests, but running valgrind only on *.c/*.h changes.

on:
  push:
    paths:
      - ".github/workflows/test-valgrind.yml"
      - "**.c"
      - "**.h"
  pull_request:
    paths:
      - ".github/workflows/test-valgrind.yml"
      - "**.c"
      - "**.h"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker: [
          ubuntu-22.04-jammy-amd64-valgrind,
        ]
        dockerTag: [main]

    name: ${{ matrix.docker }}

    steps:
    - uses: actions/checkout@v4

    - name: Build system information
      run: python3 .github/workflows/system-info.py

    - name: Docker pull
      run: |
        docker pull pythonpillow/${{ matrix.docker }}:${{ matrix.dockerTag }}

    - name: Build and Run Valgrind
      run: |
        # The Pillow user UID can differ between docker images (1000/1001).
        # Detect it to avoid permission issues when building in a bind mount.
        pillow_uid=$(docker run --rm pythonpillow/${{ matrix.docker }}:${{ matrix.dockerTag }} sh -lc 'id -u pillow')
        pillow_gid=$(docker run --rm pythonpillow/${{ matrix.docker }}:${{ matrix.dockerTag }} sh -lc 'id -g pillow')
        sudo chown -R "$pillow_uid:$pillow_gid" "$GITHUB_WORKSPACE"
        docker run --name pillow_container -e "PILLOW_VALGRIND_TEST=true" -v $GITHUB_WORKSPACE:/Pillow pythonpillow/${{ matrix.docker }}:${{ matrix.dockerTag }}
        sudo chown -R runner "$GITHUB_WORKSPACE"
